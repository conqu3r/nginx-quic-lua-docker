name: Docker

on:
  schedule:
    - cron: '27 7 * * *'
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  LOCAL_IMAGE: nginx-quic-lua:ci

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image-artifact: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker buildx build --pull --no-cache --load --tag "$LOCAL_IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Smoke test image
        run: sh tests/smoke-test.sh "$LOCAL_IMAGE"

      - name: Scan local image with Grype
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker:${{ env.LOCAL_IMAGE }}
          fail-build: false
          output-format: json

      - name: Upload vulnerability report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-report-${{ github.run_attempt }}
          path: ${{ steps.scan.outputs.json }}
          if-no-files-found: error

      - name: Block fixable high and critical vulnerabilities
        env:
          REPORT: ${{ steps.scan.outputs.json }}
        run: |
          jq -e '.matches | type == "array"' "$REPORT" > /dev/null
          jq -r '
            .matches
            | group_by(.vulnerability.severity)[]
            | "- \(.[0].vulnerability.severity): \(length)"
          ' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          blockers=$(jq -r '
            .matches[]
            | select(.vulnerability.fix.state == "fixed")
            | select(.vulnerability.severity | ascii_downcase | IN("high", "critical"))
            | [.vulnerability.id, .artifact.name, .artifact.version,
               (.vulnerability.fix.versions | join(", "))]
            | @tsv
          ' "$REPORT")
          if [[ -n "$blockers" ]]; then
            echo '::error::The image contains high or critical vulnerabilities with fixes available.'
            printf 'Vulnerability\tPackage\tInstalled version\tFixed version(s)\n%s\n' "$blockers"
            exit 1
          fi

      - name: Save verified image
        if: github.event_name == 'push' || github.event_name == 'schedule'
        shell: bash
        run: docker image save "$LOCAL_IMAGE" | gzip --fast > "$RUNNER_TEMP/nginx-image.tar.gz"

      - name: Upload verified image
        id: archive
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nginx-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nginx-image.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish-ghcr:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Download verified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.image-artifact }}
          path: ${{ runner.temp }}
          digest-mismatch: error

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GHCR image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Publish and sign verified image
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker image load --input "$RUNNER_TEMP/nginx-image.tar.gz"
          signed_digest=''
          push_log="$RUNNER_TEMP/ghcr-push.log"
          while IFS= read -r tag; do
            docker image tag "$LOCAL_IMAGE" "$tag"
            docker image push "$tag" | tee "$push_log"
            digest=$(awk -v tag="${tag##*:}" '$1 == tag ":" && $2 == "digest:" { print $3 }' "$push_log")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo '::error::Docker push did not report a valid image digest.'
              exit 1
            fi
            if [[ "$digest" != "$signed_digest" ]]; then
              cosign sign --yes "${tag%:*}@$digest"
              signed_digest="$digest"
            fi
          done <<< "$TAGS"

  publish-docker-hub:
    if: github.repository == 'conqu3r/nginx-quic-lua-docker' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check Docker Hub credentials
        id: credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Skipping Docker Hub publication because DOCKER_USERNAME or DOCKER_PASSWORD is missing.'
          fi

      - name: Download verified image
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.image-artifact }}
          path: ${{ runner.temp }}
          digest-mismatch: error

      - name: Log in to Docker Hub
        if: steps.credentials.outputs.enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish verified image to Docker Hub
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          docker image load --input "$RUNNER_TEMP/nginx-image.tar.gz"
          docker image tag "$LOCAL_IMAGE" conqu3r/nginx:latest
          docker image push conqu3r/nginx:latest
